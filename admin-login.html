<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | NearZo B2B Tyre Marketplace</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Shared Style Sheets if any (Optional - but we write dedicated scoped CSS inside for robustness) -->
  <link rel="stylesheet" href="/style.css">
  
  <style>
    :root {
      --glass-bg: rgba(18, 28, 62, 0.65);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glow-orange: 0 0 20px rgba(255, 140, 0, 0.25);
    }
    
    body.admin-body {
      background: radial-gradient(circle at 50% 50%, #0F172A 0%, #020617 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 24px;
      color: var(--text-light);
    }

    /* Background Sourcing Network Grid */
    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 140, 0, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 140, 0, 0.02) 1px, transparent 1px);
      mask-image: radial-gradient(circle at 50% 50%, black 40%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at 50% 50%, black 40%, transparent 80%);
      z-index: 1;
      pointer-events: none;
    }

    /* Glow Circles */
    .glow-circle {
      position: absolute;
      border-radius: var(--radius-full);
      filter: blur(100px);
      pointer-events: none;
      z-index: 1;
    }

    .glow-1 {
      top: 15%;
      left: 20%;
      width: 300px;
      height: 300px;
      background: rgba(255, 140, 0, 0.12);
      animation: floatPulse 12s ease-in-out infinite alternate;
    }

    .glow-2 {
      bottom: 15%;
      right: 20%;
      width: 350px;
      height: 350px;
      background: rgba(59, 130, 246, 0.08);
      animation: floatPulse 15s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatPulse {
      0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
      100% { transform: scale(1.15) translate(30px, -30px); opacity: 0.9; }
    }

    /* Login Card Glassmorphism */
    .login-container {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 440px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 48px 40px;
      box-shadow: var(--shadow-dark), var(--glow-orange);
      transition: var(--transition);
    }

    .login-container:hover {
      border-color: rgba(255, 140, 0, 0.2);
    }

    .login-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .login-logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .logo-dot {
      width: 12px;
      height: 12px;
      background: var(--primary-orange);
      border-radius: var(--radius-full);
      box-shadow: 0 0 10px var(--primary-orange);
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .login-logo-text {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: var(--primary-orange-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-subtitle {
      font-size: 0.95rem;
      color: var(--text-light-muted);
      margin-top: 8px;
    }

    /* Forms */
    .form-group {
      margin-bottom: 24px;
      position: relative;
    }

    .form-label {
      display: block;
      font-family: 'Outfit', sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-light-muted);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      background: rgba(10, 17, 40, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      color: var(--text-light);
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      transition: var(--transition);
      outline: none;
    }

    .form-input:focus {
      border-color: var(--primary-orange);
      background: rgba(10, 17, 40, 0.7);
      box-shadow: 0 0 12px rgba(255, 140, 0, 0.15);
    }

    /* Alert / Error Toast */
    .error-banner {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #FCA5A5;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      margin-bottom: 24px;
      display: none;
      align-items: center;
      gap: 10px;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .btn-submit {
      width: 100%;
      background: var(--primary-orange-gradient);
      color: var(--text-light);
      border: none;
      border-radius: var(--radius-md);
      padding: 14px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: var(--shadow-orange);
      transition: var(--transition);
      margin-top: 10px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px -5px rgba(255, 94, 0, 0.6);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      background: #334155;
      color: #64748B;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    /* Back home link */
    .back-home {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 0.875rem;
      color: var(--text-light-muted);
      transition: var(--transition-fast);
    }

    .back-home:hover {
      color: var(--primary-orange);
    }
  </style>
</head>
<body class="admin-body">

  <div class="grid-overlay"></div>
  <div class="glow-circle glow-1"></div>
  <div class="glow-circle glow-2"></div>

  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">
        <span class="logo-dot"></span>
        <span class="login-logo-text">NearZo Admin</span>
      </div>
      <div class="login-subtitle">Sign in to control dashboard and marketplace data</div>
    </div>

    <!-- Error Banner -->
    <div class="error-banner" id="errorBanner">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span id="errorMessage">Invalid credentials provided.</span>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username" class="form-label">ADMIN USERNAME</label>
        <div class="input-wrapper">
          <input type="text" id="username" class="form-input" placeholder="Enter username" required autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">ADMIN PASSWORD</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="form-input" placeholder="Enter password" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Authenticate</button>
    </form>

    <a href="/" class="back-home">
      ← Return to Marketplace Home
    </a>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorBanner = document.getElementById('errorBanner');
    const errorMessage = document.getElementById('errorMessage');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      
      // Hide error
      errorBanner.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Verifying...';

      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          // Redirect to dashboard on success
          window.location.href = '/admin/dashboard';
        } else {
          showError(data.message || 'Login failed. Please check credentials.');
        }
      } catch (err) {
        showError('Network error. Unable to connect to server.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Authenticate';
      }
    });

    function showError(msg) {
      errorMessage.innerText = msg;
      errorBanner.style.display = 'flex';
      
      // Focus animation shake trigger
      errorBanner.style.animation = 'none';
      errorBanner.offsetHeight; /* trigger reflow */
      errorBanner.style.animation = 'shake 0.4s ease-in-out';
    }
  </script>
</body>
</html>
